<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dog-Deer World</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    /* Sky-blue default (averaged across the 4 seasons' sky colors), NOT the old
       near-black #161410 — that ink tone was visible for a beat before the JS
       below determines SEASON and sets #load-veil's real color (it needs the
       CDN-imported THREE module to resolve first), producing a black-to-blue
       flash on first paint. Starting the whole page at a sky tone instead means
       there's nothing to flash FROM — the eventual season-exact color change is
       just a blue-to-blue refinement. */
    body { overflow: hidden; background: #AECCE4; }

    #canvas-container { position: fixed; inset: 0; }

    /* Screen-space fog vignette hugging the viewport edge — all four sides,
       including the bottom, which distance fog (scene.fog) can never reach
       because the ground there is closer to the camera than the deer.
       Background gradient is set from JS using the season's `veil` tint. */
    /* Starts invisible and fades in alongside #load-veil's reveal (same 1.7s
       duration, triggered in the same JS block) rather than snapping to full
       strength the instant the veil uncovers it. */
    #edge-fog { position: fixed; inset: 0; pointer-events: none; opacity: 0; transition: opacity 1.7s ease; }

    #hint {
      position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%);
      font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
      font-size: 11px; font-weight: 300; letter-spacing: .15em; text-transform: uppercase;
      color: rgba(240,235,225,0.38); pointer-events: none;
      transition: opacity .6s;
    }

    #e-prompt {
      position: fixed; display: none;
      font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
      font-size: 11px; font-weight: 300; letter-spacing: .14em; text-transform: uppercase;
      color: rgba(240,235,225,0.88);
      background: rgba(22,20,16,0.52);
      padding: 5px 11px 4px; border-radius: 2px;
      pointer-events: none;
      transform: translate(-50%, -200%);
      transition: opacity .25s;
    }

    #obj-label {
      position: fixed; display: none;
      font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
      font-size: 10px; font-weight: 300; letter-spacing: .08em;
      color: rgba(240,235,225,0.45);
      pointer-events: none;
      transform: translate(-50%, -80%);
    }

    #interact-text {
      position: fixed; display: none;
      font-family: Georgia, 'Times New Roman', serif;
      font-size: 13px; font-weight: 400; font-style: italic;
      color: rgba(240,235,225,0.92);
      text-align: center; max-width: 260px;
      line-height: 1.65;
      pointer-events: none;
      transform: translate(-50%, -100%);
      transition: opacity .4s;
    }

    /* Idle "says something" text — mirrors #e-prompt's look exactly (same
       small tracked-caps pill), not a jarring white speech-bubble. */
    #deer-speech {
      position: fixed; display: none;
      font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
      font-size: 11px; font-weight: 300; letter-spacing: .14em; text-transform: uppercase;
      color: rgba(240,235,225,0.88);
      background: rgba(22,20,16,0.52);
      padding: 5px 11px 4px; border-radius: 2px;
      pointer-events: none;
      transform: translate(-50%, -140%);
      transition: opacity .25s;
    }

    #sandbox-palette {
      position: fixed; bottom: 20px; right: 20px;
      display: none; flex-direction: column; align-items: center; gap: 6px;
      background: rgba(22,20,16,0.72); backdrop-filter: blur(4px);
      padding: 12px 10px; border-radius: 3px;
      border: 1px solid rgba(240,235,225,0.08);
    }
    #sandbox-palette .pal-label {
      font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
      font-size: 9px; letter-spacing: .14em; text-transform: uppercase;
      color: rgba(240,235,225,0.4); margin-bottom: 2px;
    }
    .tile-btn {
      width: 34px; height: 34px; border-radius: 2px;
      border: 1.5px solid rgba(240,235,225,0.15); cursor: pointer;
      transition: border-color .15s, transform .1s;
      flex-shrink: 0;
    }
    .tile-btn:hover { border-color: rgba(240,235,225,0.6); transform: scale(1.08); }
    .tile-btn.active { border-color: #F0EBE1; }
    .tile-btn span { display: none; }
    #sandbox-esc {
      font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
      font-size: 9px; letter-spacing: .1em; text-transform: uppercase;
      color: rgba(240,235,225,0.3); cursor: pointer; margin-top: 2px;
      transition: color .15s;
    }
    #sandbox-esc:hover { color: rgba(240,235,225,0.65); }

    #mode-badge {
      position: fixed; top: 18px; right: 20px;
      font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
      font-size: 10px; letter-spacing: .15em; text-transform: uppercase;
      color: rgba(240,235,225,0.28); pointer-events: none;
    }

    #season-badge {
      position: fixed; top: 18px; left: 20px;
      font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
      font-size: 10px; letter-spacing: .18em; text-transform: uppercase;
      color: rgba(240,235,225,0.30); pointer-events: none;
    }

    /* Load-in veil — fades from the sky colour to reveal the scene. Default
       background-color matches body's sky-blue fallback (same reasoning: be
       blue before the JS below picks the real season, not transparent/black). */
    #load-veil {
      position: fixed; inset: 0; z-index: 50; pointer-events: none;
      background-color: #AECCE4;
      opacity: 1; transition: opacity 1.7s ease;
    }

    /* ── SEASONAL ATMOSPHERE VIGNETTE ──────────────────────────────────────
       Replaces an earlier drifting-particle version (Morris: read as jarring).
       Now the SAME radial-vignette technique as #edge-fog — a per-season-tinted
       ring that frames the viewport edges, nothing moving — reused here because
       #edge-fog itself is deliberately hidden in the embed hero (see the
       'vignette off in the portfolio hero' note below), so this is what carries
       that atmospheric framing into the embed. Background is set via JS (same
       gradient formula + SEASON.veil colour edge-fog uses) right where
       edge-fog's own gradient is computed, so the two never drift apart.
       Below #load-veil (z-index 50) so it's hidden during boot and fades in
       with the reveal. */
    #season-filter { position: fixed; inset: 0; pointer-events: none; opacity: 0; transition: opacity 1.7s ease; }
  </style>
</head>
<body>

<div id="canvas-container"></div>
<div id="edge-fog"></div>
<div id="season-filter"></div>
<div id="hint">click to guide &middot; wanders on its own</div>
<div id="e-prompt">[ e ] interact</div>
<div id="obj-label"></div>
<div id="interact-text"></div>
<div id="deer-speech"></div>
<div id="sandbox-palette">
  <div class="pal-label">Build</div>
</div>
<div id="mode-badge"></div>
<div id="season-badge"></div>
<div id="load-veil"></div>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.165.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.165.0/examples/jsm/"
} }
</script>
<script type="module">
import * as THREE from 'three';
// Used to collapse each tree's separate trunk/canopy meshes into ONE merged
// local-space geometry per variant (see the "Instanced trees" section below) —
// the whole point is fewer, bigger meshes instead of thousands of tiny ones.
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';

// ── Palette ──────────────────────────────────────────────────────────────────
const C = {
  terra:       0xA04038,
  rose:        0xD07885,
  parchment:   0xF0EBE1,
  ink:         0x161410,
  amber:       0xC88828,
  amberDark:   0xA06818,
  brown:       0x5C3A1E,
  brownDark:   0x3E2510,
  soil:        0x6E5638,   // earthy base under interactable objects (was red terra)
  stone:       0x8A8070,
  stoneLight:  0xB8B0A0,
  wood:        0x8B5E3C,
  gold:        0xD4AF37,
  goldDark:    0xA8841F,
  greyHouse:   0x8A8A8E,
  greyHouseLt: 0xACACB0,
  meadow:      0x5A8038,
  mint:        0x7A9887,
};

// ── Seasons ──────────────────────────────────────────────────────────────────
// One is picked at random every page load and drives every color in the scene.
// Winter freezes the pond solid (opaque ice the deer walks on) and strips the
// deciduous trees bare. SEASON must be chosen FIRST — terrain and tree colors
// bake at build time from it.
const SEASONS = {
  spring: {
    name: 'Spring',
    sky: 0xC2DAEC,
    sun: 0xFFF4DC, sunI: 1.15, hemiSky: 0xEFEAD8, hemiGround: 0x4A6A2C, hemiI: 0.55,
    water: { shallow: 0x8FC6C0, deep: 0x3E6E78, shore: 0xCBD9C6 },
    // Ambient surface motion (see updateWaterWake). Spring: fresh, moderate.
    waterMotion: { amp: 0.050, speed: 1.00, scale: 0.55, shimmer: 0.060 },
    // Wind (see WIND_* globals + updateTreeWind/updateBushWind). Modeled on real
    // Concord MA / Walden Pond climate: spring is the most changeable season
    // (equinoctial winds) — still mostly out of the NW but the gustiest of the
    // four. travelBearing is the direction the air MOVES (0=N,90=E,180=S,270=W),
    // i.e. 180° rotated from the "wind FROM" bearing meteorologists report.
    wind: { travelBearing: 125, speed: 0.62, gust: 0.55 },
    veil: 0xCFE3D2,   // viewport edge-fog tint: soft green-white morning mist
    floor: [0x6DA03C, 0x7DAE4A, 0x5F9433, 0x86B454],
    pine: [0x2E4A1F, 0x355A22],
    broadleaf: [0x7FB63E, 0x8FC24E, 0x9ACB5A, 0xE6A9C0],
    blossom: true, snow: false, bare: false, ice: false,
  },
  summer: {
    name: 'Summer',
    sky: 0x8FC0EA,
    sun: 0xFFF2D8, sunI: 1.25, hemiSky: 0xEFEAD8, hemiGround: 0x2E4A1F, hemiI: 0.55,
    water: { shallow: 0x86C6C4, deep: 0x2E7A86, shore: 0xCBD9C6 },
    // Summer: glassy, slow, calm — smallest amplitude, slowest drift.
    waterMotion: { amp: 0.035, speed: 0.70, scale: 0.42, shimmer: 0.045 },
    // Real New England summers run out of the SW (Bermuda-high influence) and
    // are the calmest season of the year — lowest speed/gust of the four.
    wind: { travelBearing: 45, speed: 0.30, gust: 0.20 },
    veil: 0xEAE2C4,   // viewport edge-fog tint: warm golden summer haze
    floor: [0x4E7A2E, 0x5E8A38, 0x447026, 0x568030],
    pine: [0x2E4A1F, 0x274018],
    broadleaf: [0x4E8A2E, 0x5E9A38, 0x69A542],
    blossom: false, snow: false, bare: false, ice: false,
  },
  autumn: {
    name: 'Autumn',
    sky: 0x9FC4E0,
    sun: 0xFFE6C0, sunI: 1.10, hemiSky: 0xF0E4D0, hemiGround: 0x6E5A30, hemiI: 0.55,
    water: { shallow: 0x7FA6AE, deep: 0x36606E, shore: 0xC6B79A },
    // Autumn: breezier — larger, faster, choppier, more shimmer (wind on water).
    waterMotion: { amp: 0.060, speed: 1.25, scale: 0.62, shimmer: 0.075 },
    // Wind swings back from summer's SW toward winter's NW as fronts return —
    // picking back up in strength and turbulence.
    wind: { travelBearing: 135, speed: 0.55, gust: 0.50 },
    veil: 0xD8C6A2,   // viewport edge-fog tint: amber autumn mist
    floor: [0x7A6A38, 0x8A7A40, 0x6E7A38, 0x907C3E],
    pine: [0x2E4A1F, 0x355A22],
    broadleaf: [0xC44A22, 0xD97A28, 0xE0B030, 0xB03A2A],
    blossom: false, snow: false, bare: false, ice: false,
  },
  winter: {
    name: 'Winter',
    sky: 0xC8D0D8,
    sun: 0xEAEAF0, sunI: 0.85, hemiSky: 0xE6ECF0, hemiGround: 0xB8BEC2, hemiI: 0.6,
    water: { shallow: 0x8FA2A8, deep: 0x35484E, shore: 0xD8DEE2 },
    // Winter: pond is frozen solid — no WATER motion (updateWaterWake returns
    // early on ice), but the WIND itself does not stop: January is the
    // windiest month on record for this region, and bare branches actually
    // read "whippier" per unit of wind than leafy ones (less mass/damping).
    // So trees + bushes keep swaying at the highest speed of the four seasons.
    waterMotion: { amp: 0.0, speed: 0.0, scale: 0.5, shimmer: 0.0 },
    wind: { travelBearing: 135, speed: 0.70, gust: 0.35 },
    veil: 0xC9D6E2,   // viewport edge-fog tint: icy blue winter air
    floor: [0xDDE2E4, 0xE6EAEC, 0xD2D8DA, 0xEAEEF0],
    pine: [0x2E4A1F, 0x3A5A2A],
    broadleaf: [0x5C4A38],
    blossom: false, snow: true, bare: true, ice: true,
  },
};
const SEASON_KEYS = ['spring', 'summer', 'autumn', 'winter'];
// Random per load, but overridable via ?season=spring|summer|autumn|winter for
// deterministic verification of season-specific behaviour.
const _seasonParam = new URLSearchParams(location.search).get('season');
const SEASON = SEASONS[SEASON_KEYS.includes(_seasonParam) ? _seasonParam
              : SEASON_KEYS[Math.floor(Math.random() * SEASON_KEYS.length)]];
document.getElementById('season-badge').textContent = SEASON.name;
document.title = 'Dog-Deer World — ' + SEASON.name;
{
  const veil = document.getElementById('load-veil');
  const edgeFog = document.getElementById('edge-fog');
  const seasonFilter = document.getElementById('season-filter');
  veil.style.backgroundColor = '#' + new THREE.Color(SEASON.sky).getHexString();
  // Fade the veil out AND the edge-fog vignette in together, on the next
  // frame so both transitions run — the vignette used to snap to full
  // strength the instant the veil uncovered it (no transition of its own);
  // now it ramps in alongside the reveal instead of arriving pre-formed.
  requestAnimationFrame(() => requestAnimationFrame(() => {
    veil.style.opacity = '0';
    edgeFog.style.opacity = '1';
    seasonFilter.style.opacity = '1';
  }));

  // Viewport edge fog: a radial vignette in the season's veil tint, wrapping
  // ALL four frame edges (unlike scene.fog, which can't reach the bottom).
  // Deliberately a thin ring — transparent through ~62% of the frame, only
  // building in the outer ~quarter, strongest in the corners.
  // Size is left to the CSS default (farthest-corner, no explicit W/H) so the
  // ellipse's own aspect ratio always matches the viewport's — a hardcoded
  // "ellipse 120% 115%" was nearly circular, which on a wide 16:9 box meant
  // the alpha ramp never reached the actual edges (even the corner normalized
  // to ~0.60, under the 62% stop) — vignette was effectively invisible on
  // some sides depending on window aspect ratio. farthest-corner makes each
  // edge midpoint land at exactly 100% on its own axis, so all four sides
  // ramp in evenly regardless of viewport shape.
  // Bit-shift the raw hex — do NOT round-trip through THREE.Color here: with
  // renderer color management on, THREE.Color converts hex to LINEAR space, so
  // .r/.g/.b come back darker than the sRGB values the CSS gradient needs
  // (0xD8C6A2 was rendering as rgb(175,144,92) instead of rgb(216,198,162)).
  const v = SEASON.veil;
  const rgb = ((v >> 16) & 255) + ',' + ((v >> 8) & 255) + ',' + (v & 255);
  const vignette = 'radial-gradient(ellipse at 50% 50%, rgba(' + rgb + ',0) 62%, rgba(' + rgb + ',0.38) 84%, rgba(' + rgb + ',0.8) 100%)';
  edgeFog.style.background = vignette;
  // Same vignette, on #season-filter — carries the atmospheric framing into
  // the embed hero, where #edge-fog itself is turned off (see the embed
  // bridge below). Static (no animation): the "atmosphere" is the seasonal
  // tint framing the frame edges, not moving elements.
  seasonFilter.style.background = vignette;
}

// ── Wind ─────────────────────────────────────────────────────────────────────
// World convention: bearing 0°=North=-Z, 90°=East=+X (compass, clockwise from
// north) — matches a top-down map reading. travelBearing is the direction the
// AIR MOVES (not the meteorological "wind from" bearing), so it's already the
// vector trees/water should lean/travel along.
const _windRad = THREE.MathUtils.degToRad(SEASON.wind.travelBearing);
const WIND_DIR_X = Math.sin(_windRad), WIND_DIR_Z = -Math.cos(_windRad);
const WIND_SPEED = SEASON.wind.speed;
const WIND_GUST = SEASON.wind.gust;

// ── Wind swell ────────────────────────────────────────────────────────────
// Wind pushes a slow traveling swell across the lake, which is what makes a
// real waterline advance and retreat. Modeled the same way the tree-sway
// traveling wave already works in this file: a sine whose PHASE depends on
// position dotted with wind direction (so the swell rolls downwind rather
// than the whole surface pumping in lockstep), with tempo/amplitude scaled by
// the season's actual wind speed/gustiness (calmer seasons swell slower and
// smaller). Consumed only by updateWaterWake — the ground never uses this;
// beaches don't pulse, water moves over them.
// Wavelength of the swell across the world (2π/K ≈ 28 units — roughly a
// lake-width, so a crest visibly sweeps through rather than the whole surface
// pumping in unison).
const SWELL_TRAVEL_K = 0.22;
// Returns the swell's Y offset (WORLD UNITS) of the water surface at a point,
// given that point's distance along the wind direction. This is the core of
// the whole effect and mirrors the reference technique: a real oscillating
// water LEVEL. Everything else — where the edge sits, where foam appears, how
// far up the beach the water reaches — falls out of comparing this moving
// surface against the static lakebed, exactly like a real lake. Phase depends
// on position·windDirection (same traveling-wave shape as the tree sway), so
// the swell rolls downwind across the body instead of the sheet bobbing as
// one rigid plane.
// Amplitudes are deliberately SMALL in world units (the surface only heaves a
// little — a lake doesn't visibly pump up and down). The waterline still
// travels because the lakebed here is gently sloped: measured slopes around
// this shore run ~0.13 (gentle) to ~0.79 (steep bank), i.e. a 1.3x-8x
// horizontal amplification of any vertical change, ~3.9x median — so even a
// modest swell reaches visibly up the shallow beaches while barely moving
// against the steep banks, same as a real lake.
// Trimmed twice now (was 0.07/0.13, then 0.03/0.055) — Morris said the first
// cut still read too dramatic. Summer peak amplitude is now a quiet,
// barely-there heave.
// Third change here (2026-07-16): spring/autumn were STILL noticeably more
// dramatic than summer, because amplitude scaled off raw WIND_SPEED
// (spring 0.62 / autumn 0.55 vs. summer's 0.30 — more than double), so every
// cut to the shared coefficients preserved that same wide spread between
// seasons even as the absolute numbers shrank. Fix: anchor amplitude at
// summer's own wind speed (the season Morris confirmed is calm enough) and
// only scale the DELTA above that reference, with a much gentler coefficient
// — so summer is the baseline "scale," and other seasons vary around it by a
// controlled, smaller amount rather than the full raw wind-speed spread.
// Winter (0.70, highest of all) never reaches this code — ice returns early
// in updateWaterWake — so it doesn't need capping here.
const SWELL_WIND_REF = 0.30;    // summer's WIND_SPEED — the amplitude scale/anchor
const SWELL_AMP_BASE = 0.022;   // amplitude AT the reference (≈ previous summer amplitude)
const SWELL_AMP_WIND = 0.008;   // added per unit of wind speed ABOVE the reference only
function swellAt(windPhase, gustEnv) {
  const tempo = 0.5 + WIND_SPEED * 1.3;
  const amp = SWELL_AMP_BASE + Math.max(0, WIND_SPEED - SWELL_WIND_REF) * SWELL_AMP_WIND + WIND_GUST * 0.014;
  return Math.sin(t * tempo - windPhase * SWELL_TRAVEL_K) * amp * (0.55 + 0.45 * gustEnv);
}
// The water's live surface height at ANY (x,z) — not just a mesh vertex —
// combining the swell with the same two-crossed-sine ambient chop the mesh
// itself uses (WATER_KA_X etc., hoisted from buildWaterMesh). This is what
// lets something other than the water mesh (namely the deer, see
// SWIM_DEPTH_MIN/MAX below) genuinely read "how high is the water right
// here right now" instead of approximating it with a static formula.
function waterSurfaceHeightAt(x, z, gustEnv) {
  const swell = swellAt(x * WIND_DIR_X + z * WIND_DIR_Z, gustEnv);
  const wm = SEASON.waterMotion;
  const hA = Math.sin(x * WATER_KA_X + z * WATER_KA_Z + t * wm.speed);
  const hB = Math.sin(x * WATER_KB_X + z * WATER_KB_Z + t * wm.speed * 0.8);
  return WATER_LEVEL + swell + (hA + hB) * (wm.amp * 0.5);
}
// Vertical depth over which the edge fades dry→wet. Sized to be a bit COARSER
// than one mesh quad's worth of bed height (~0.48 units of ground × the local
// slope): any finer and the fade would resolve inside a single quad and the
// waterline would read as a polygonal stair-step rather than a line. Because
// it's a DEPTH, it also self-adjusts to the terrain — the same constant gives
// a soft wide lapping edge on a gentle beach and a crisp one against a steep
// bank, which is exactly the real-world behavior.
const EDGE_SOFT = 0.12;
// Depth over which the shallow shore tint + foam band ride, measured from the
// live waterline inward. Because these are anchored to DEPTH (not a baked
// position), they automatically travel with the edge as it moves.
const FOAM_DEPTH = 0.22;
const SHORE_TINT_DEPTH = 0.42;

// (Wake/contact layering constants live further down, next to updateWaterWake
// — they depend on DEER_R, which is declared with the collision system below.
// This file evaluates top-to-bottom at module load, so anything referencing it
// must come after it; see the TDZ notes in handoff.md.)

function snowify(hex, amt = 0.65) {
  return new THREE.Color(hex).lerp(new THREE.Color(0xE8EEF0), amt).getHex();
}

// ── Scene ────────────────────────────────────────────────────────────────────
let W = window.innerWidth, H = window.innerHeight;
const container = document.getElementById('canvas-container');

const scene = new THREE.Scene();
scene.background = new THREE.Color(SEASON.sky);
// Mild distance haze only — its one remaining job is hiding the world rim /
// far treeline so the forest feels boundless (camera-to-far-frame-edge is
// ~52-54 units; CAM_OFFSET (0,27,20.5) puts the deer at ~34). The VISIBLE
// "fog around the viewport" is NOT this — it's the #edge-fog screen-space
// vignette (see the load-veil block above), which wraps all four frame edges
// with a per-season tint; scene.fog was tried as the sole mechanism first but
// distance fog physically can't reach the bottom frame edge (that ground is
// closer to the camera than the deer) and covered too much of the frame.
scene.fog = new THREE.Fog(SEASON.sky, 40, 58);

const camera = new THREE.PerspectiveCamera(44, W / H, 0.1, 120);

// preserveDrawingBuffer is opt-in via ?capture=1 — it lets the canvas be read
// back for screenshots/toDataURL (the WebGL buffer otherwise clears after each
// composite, which stalls headless preview capture). Off by default so the
// real easter-egg pays no perf cost; only dev/verification passes enable it.
const CAPTURE = new URLSearchParams(location.search).has('capture');
// EMBED = running as the portfolio hero iframe (?embed=1), vs the standalone
// full-screen easter-egg page. Referenced mrmrs.cc's own hero renderer to size
// these: it renders at 1× device-pixels (NOT the display's 1.5×) with a
// high-performance GPU hint. In the embed the world is a small background band
// behind the bio text, so it can afford mrmrs's lean settings; the standalone
// page stays full-fidelity since it's the whole screen and the focus.
const EMBED = new URLSearchParams(location.search).has('embed');
// Idle deer turning to face the cursor — turned off for now (Morris's call,
// 2026-07-14). Flip to true to bring it back; see the idle-turn block further
// down (search MOUSE_LOOK_ENABLED).
const MOUSE_LOOK_ENABLED = false;
// powerPreference:'high-performance' matches mrmrs.cc — hints the browser to

      // swell either — a frozen surface doesn't rise and fall.
      vcol.copy(ice).lerp(iceDeep, THREE.MathUtils.clamp((inf - 0.3) / 0.6, 0, 1));
    } else {
      // Only the shallow→deep DEPTH gradient is baked (a real, static
      // property of the bed). Shore tint, foam and the water's actual
      // extent are all recomputed per frame from the live surface height
      // vs. the bed — see updateWaterWake.
      vcol.copy(shallow).lerp(deep, THREE.MathUtils.clamp((inf - 0.30) / 0.55, 0, 1));
    }
    positions.push(vx, 0, vz);
    colors.push(vcol.r, vcol.g, vcol.b, 1);
    bed.push(heightAt(vx, vz));
    windPh.push(vx * WIND_DIR_X + vz * WIND_DIR_Z);
    return vi;
  };
  for (let f = 0; f < srcIdx.count; f += 3) {
    const a = srcIdx.getX(f), b2 = srcIdx.getX(f + 1), c2 = srcIdx.getX(f + 2);
    let minInf = Infinity, minGroundH = Infinity;
    for (const vi of [a, b2, c2]) {
      const vx = src.getX(vi), vz = src.getZ(vi);
      minInf = Math.min(minInf, lakeFieldAt(vx, vz));
      minGroundH = Math.min(minGroundH, heightAt(vx, vz));
    }
    // Keep anything the water can plausibly reach at ANY point in the swell
    // cycle. The old cull (`minInf < 0.10` + drop any face whose ground pokes
    // above the waterline) is precisely why the edge could never move: every
    // triangle that would become newly-wet had already been deleted at build
    // time, so the boundary was frozen into the geometry itself.
    if (minInf < 0.02) continue;
    if (minGroundH > WATER_LEVEL + SWELL_HEADROOM) continue;
    indices.push(addVert(src.getX(a), src.getZ(a)),
                 addVert(src.getX(b2), src.getZ(b2)),
                 addVert(src.getX(c2), src.getZ(c2)));
  }
  geo.dispose();
  waterGeo = new THREE.BufferGeometry();
  waterGeo.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
  // itemSize 4 (RGBA): Three.js enables USE_COLOR_ALPHA when a vertexColors
  // material sees a 4-component color attribute, so per-vertex alpha works —
  // that's what lets the water fade out exactly where its surface drops below
  // the bed, giving a real receding waterline rather than a painted one.
  waterGeo.setAttribute('color', new THREE.Float32BufferAttribute(colors, 4));
  waterGeo.setIndex(indices);
  waterGeo.computeVertexNormals();
  waterBedH = Float32Array.from(bed);
  waterWindPhase = Float32Array.from(windPh);
  waterBaseColor = Float32Array.from(waterGeo.attributes.color.array);

  // Precompute the two ambient-wave spatial phases per vertex (dot of position
  // with two different wave vectors). Per frame we only add t*speed and take a
  // sin — no per-vertex spatial math on the hot path.
  // Wave A travels along the season's actual wind direction (real wind-driven
  // ripple travels downwind); wave B is a secondary cross-chop at a nearby
  // angle offset, so the surface doesn't read as perfectly parallel lines.
  // kAx/kAz/kBx/kBz are hoisted to module scope (not just a local block) so
  // waterSurfaceHeightAt (below) can compute the SAME wave at any arbitrary
  // (x,z) — in particular the deer's own position — not just at mesh
  // vertices, which is what lets the deer's float height genuinely track the
  // water surface instead of a disconnected approximation of it.
  {
    const wm = SEASON.waterMotion, s = wm.scale;
    WATER_KA_X = WIND_DIR_X * s * 0.78; WATER_KA_Z = WIND_DIR_Z * s * 0.78;
    const _crossRad = _windRad + THREE.MathUtils.degToRad(55);
    WATER_KB_X = Math.sin(_crossRad) * s * 0.85; WATER_KB_Z = -Math.cos(_crossRad) * s * 0.85;
    const parr = waterGeo.attributes.position.array;
    const vn = waterGeo.attributes.position.count;
    waterPhaseA = new Float32Array(vn);
    waterPhaseB = new Float32Array(vn);
    for (let i = 0; i < vn; i++) {
      const vx = parr[i * 3], vz = parr[i * 3 + 2];
      waterPhaseA[i] = vx * WATER_KA_X + vz * WATER_KA_Z;
      waterPhaseB[i] = vx * WATER_KB_X + vz * WATER_KB_Z;
    }
  }

  waterMesh = new THREE.Mesh(waterGeo, new THREE.MeshLambertMaterial({
    vertexColors: true, transparent: !SEASON.ice, opacity: SEASON.ice ? 1 : 0.88,
    flatShading: false,
  }));
  waterMesh.position.y = SEASON.ice ? WATER_LEVEL + 0.01 : WATER_LEVEL;
  waterMesh.receiveShadow = true;
  scene.add(waterMesh);
}

// ── Collision ────────────────────────────────────────────────────────────────
// Objects are HARD hitboxes — the deer is blocked. Trees are SOFT — they get
// nudged aside by the deer (and spring back) instead of stopping it, so the
// deer never gets hung up on a trunk (see updateTrees).
const COLLIDERS = []; // hard: objects only { x, z, r }
// Soft: { mesh, idx, bx, bz, baseY, scale, ox, oz, pushRotZ, pushRotX, flex,
// windSeed }. `mesh`/`idx` point at a shared THREE.InstancedMesh + this
// tree's slot in it (see "Instanced trees" below) — there is no per-tree
// Object3D anymore, so every per-frame update (wind sway, deer-push lean)
// writes a Matrix4 into that slot instead of touching Group.position/rotation.
const TREES = [];
const BUSHES = [];    // wind-only, no deer collision: { g, bx, bz, flex, windSeed }
const DEER_R = 0.42;
// Radii (squared, for cheap comparison) for masking the ambient water wave
// near the deer's body — see updateWaterWake. Shrunk (was 1.3x/3.2x) now
// that the deer's own Y position tracks waterSurfaceHeightAt while swimming
// (see SWIM_DEPTH_MIN/MAX below): since the body moves WITH the water, a
// wide dead-flat halo around it is no longer needed to prevent clipping —
// only a small margin for the sharpest local variation right at the body.
// This is what makes the water immediately around/under the deer ("the
// puddle") actually move like the rest of the lake instead of sitting in a
// large static patch.
const AMBIENT_MASK_CLEAR_R2 = (DEER_R * 0.85) ** 2;
const AMBIENT_MASK_FULL_R2 = (DEER_R * 1.5) ** 2;
// Per-species/per-prop sway stiffness (lower = stiffer) and a random per-instance
// phase offset (windSeed) so neighboring plants don't sway in perfect lockstep —
// see updateTreeWind/updateBushWind, which use these plus a position-based
// traveling-wave phase so gusts visibly sweep across the field in wind direction.
function makeWindSeed(x, z) { return hash2(x * 3.1, z * 7.7) * Math.PI * 2; }
// Registers one instance slot in TREES (called from finalizeInstancedTrees,
// once per placed tree, after the InstancedMesh it lives in has been built).
function registerTreeInstance(meshRef, idx, x, z, baseY, scale, flex) {
  TREES.push({ mesh: meshRef, idx, bx: x, bz: z, baseY, scale,
               ox: 0, oz: 0, pushRotZ: 0, pushRotX: 0,
               flex, windSeed: makeWindSeed(x, z) });
}
// Spatial grid for TREES (built once, after scatter, below) — lets updateTrees
// look up only the trees near the deer instead of scanning all ~1500 of them
// every frame. TREE_CELL is > 2×TREE_PUSH_R (defined near updateTrees) so a
// 3×3 neighborhood always covers the deer's full push radius.
const TREE_CELL = 2.4;
const treeGrid = new Map(); // "cellX,cellZ" -> tree[]
function treeCellKey(x, z) { return Math.floor(x / TREE_CELL) + ',' + Math.floor(z / TREE_CELL); }

// ── Trees: Walden Woods (white pine + oak + hickory) ─────────────────────────
function nearAnyObject(x, z, margin) {
  for (let i = 0; i < OBJS.length; i++) {
    if (Math.hypot(x - OBJS[i].pos[0], z - OBJS[i].pos[1]) < margin) return true;
  }
  return false;
}
function pineCrownColor() { return SEASON.pine[(Math.random() * SEASON.pine.length) | 0]; }
function broadleafColor() { return SEASON.broadleaf[(Math.random() * SEASON.broadleaf.length) | 0]; }

// ── Instanced trees ──────────────────────────────────────────────────────────
// Was: every scattered tree built its own unique THREE.Group of individually-
// sized Mesh parts, each defaulting to castShadow=true — ~1100+ trees × 2-4
// parts ≈ ~2750 real draw calls in the main pass, DOUBLED again in the
// shadow-depth pass (no InstancedMesh anywhere). That's the dominant
// draw-call cost in the whole scene (2026-07-16 perf audit).
//
// Now: each species gets TREE_VARIANTS (8) pre-built "prefab" geometries —
// trunk + canopy parts merged into ONE local-space BufferGeometry apiece,
// with per-part color BAKED IN as a vertex-color attribute (mergeGeometries
// requires matching attribute sets, so every part gets a 'color' attribute
// before merging). Every placed tree of a given species/variant becomes one
// slot in a shared THREE.InstancedMesh for that variant — position/rotation/
// scale live in the instance matrix, not a per-tree Object3D. Total draw
// calls for ~1100 trees: at most 3 species × 8 variants = 24 (down from
// ~2750), and castShadow/receiveShadow on an InstancedMesh costs ONE draw
// call for the whole batch in the shadow pass too.
//
// A tree's random size (`th` in the old per-tree code) scaled EVERY dimension
// of its geometry uniformly — trunk radius, height, canopy size, position
// offsets, all multiplied by the same th. That means building each variant at
// a canonical th=1 and applying th as a uniform instance scale afterward is
// mathematically identical to the old per-tree-unique geometry, just moved
// from geometry-bake-time to instance-transform-time.
//
// Trade-off (flagged, not hidden): variety drops from "every tree
// mathematically unique" to "8 repeated prefabs per species, each randomly
// resized/recolored per instance" — a standard game-dev technique, and
// imperceptible walking through a dense forest, but not literally identical
// to before. A subtle per-instance color jitter (instanceColor) is layered on
// top specifically to soften the "same prefab repeated" look further.
const TREE_VARIANTS = 8;
const TREE_MAT = new THREE.MeshLambertMaterial({ vertexColors: true, flatShading: true });
const TREE_INSTANCED_MESHES = []; // every InstancedMesh built below, for the
                                   // per-frame instanceMatrix.needsUpdate pass

function colorizeGeometry(geo, hex) {
  const c = new THREE.Color(hex);
  const n = geo.attributes.position.count;
  const colors = new Float32Array(n * 3);
  for (let i = 0; i < n; i++) { colors[i * 3] = c.r; colors[i * 3 + 1] = c.g; colors[i * 3 + 2] = c.b; }
  geo.setAttribute('color', new THREE.BufferAttribute(colors, 3));
  return geo;
}
// parts: [{ geo, color }] in LOCAL space (already translated/rotated/scaled
// to their final position within the tree) — merges into one geometry so the
// whole tree becomes a single instance slot.
function mergeParts(parts) {
  // mergeGeometries requires ALL inputs indexed or ALL non-indexed — Cylinder/
  // ConeGeometry are indexed but IcosahedronGeometry (oak/hickory canopy
  // blobs) is not, so mixing trunk+canopy parts failed until every part is
  // normalized to non-indexed first (safe for flatShading, which computes
  // face normals from screen-space derivatives regardless of indexing).
  const geos = parts.map(p => {
    const g = p.geo.index ? p.geo.toNonIndexed() : p.geo;
    if (g !== p.geo) p.geo.dispose();
    return colorizeGeometry(g, p.color);
  });
  const merged = mergeGeometries(geos, false);
  geos.forEach(g => g.dispose());
  return merged;
}

function pineVariantGeometry() {
  const th = 1; // canonical size — real per-tree size applied as instance scale
  const trunk = new THREE.CylinderGeometry(0.05, 0.09, th * 0.36, 5);
  trunk.translate(0, th * 0.17, 0);
  const lower = new THREE.ConeGeometry(th * 0.32, th * 0.52, 6);
  lower.translate(0, th * 0.52, 0);
  const upper = new THREE.ConeGeometry(th * 0.22, th * 0.44, 6);
  upper.translate(0, th * 0.84, 0);
  const parts = [
    { geo: trunk, color: C.brownDark },
    { geo: lower, color: pineCrownColor() },
    { geo: upper, color: pineCrownColor() },
  ];
  if (SEASON.snow) {
    const cap = new THREE.ConeGeometry(th * 0.155, th * 0.20, 6);
    cap.translate(0, th * 1.02, 0);
    parts.push({ geo: cap, color: 0xE8EEF0 });
  }
  return mergeParts(parts);
}

// Wide-spreading oak. Winter: bare limbs that ORIGINATE at the trunk top (no
// gap between limb and trunk — the limb's inner half overlaps the trunk).
// Rotation order matters here: an Object3D with rotation.set(rx, 0, rz) under
// THREE's default 'XYZ' Euler order composes as Rz*Rx*v — reproduced below by
// baking geo.rotateX(rx) THEN geo.rotateZ(rz) (each call transforms the
// ALREADY-rotated vertices, so calling X then Z gives Rz*(Rx*v), the same
// order). The old code's `limb.translateY(len*0.4)` ran on an object already
// positioned+rotated, i.e. a translate along the LOCAL (rotated) Y axis
// before the position offset — equivalent to translating in local space
// FIRST, then rotating, then translating by position (T_pos * R * T_local).
function oakVariantGeometry() {
  const th = 1;
  const trunkH = th * (SEASON.bare ? 0.95 : 0.7);
  const trunk = new THREE.CylinderGeometry(0.08, 0.12, trunkH, 6);
  trunk.translate(0, trunkH * 0.5, 0);
  const parts = [{ geo: trunk, color: C.brown }];
  if (SEASON.bare) {
    const top = trunkH * 0.92;
    for (let k = 0; k < 5; k++) {
      const ang = (k / 5) * Math.PI * 2 + Math.random() * 0.4;
      const len = th * 0.6;
      const limb = new THREE.CylinderGeometry(0.02, 0.045, len, 4);
      limb.translate(0, len * 0.4, 0);
      limb.rotateX(Math.sin(ang) * 0.9);
      limb.rotateZ(Math.cos(ang) * 0.9);
      limb.translate(0, top, 0);
      parts.push({ geo: limb, color: C.brown });
    }
  } else {
    const col = broadleafColor();
    const blobs = [[0, th * 0.9, 0, 0.42], [-0.22, th * 0.82, 0.1, 0.30],
                   [0.24, th * 0.84, -0.08, 0.30], [0.02, th * 0.78, -0.22, 0.26]];
    blobs.forEach(([bx, by, bz, s]) => {
      const geo = new THREE.IcosahedronGeometry(s * (0.85 + Math.random() * 0.3), 0);
      geo.scale(1, 0.85, 1);
      geo.translate(bx, by, bz);
      parts.push({ geo, color: Math.random() < 0.75 ? col : broadleafColor() });
    });
  }
  return mergeParts(parts);
}

function hickoryVariantGeometry() {
  const th = 1;
  const trunkH = th * (SEASON.bare ? 0.8 : 0.6);
  const trunk = new THREE.CylinderGeometry(0.05, 0.085, trunkH, 5);
  trunk.translate(0, trunkH * 0.5, 0);
  const parts = [{ geo: trunk, color: C.brown }];
  if (SEASON.bare) {
    const top = trunkH * 0.9;
    for (let k = 0; k < 4; k++) {
      const ang = (k / 4) * Math.PI * 2 + Math.random();
      const len = th * 0.5;
      const limb = new THREE.CylinderGeometry(0.015, 0.035, len, 4);
      limb.translate(0, len * 0.4, 0);
      limb.rotateX(Math.sin(ang) * 0.7);
      limb.rotateZ(Math.cos(ang) * 0.7);
      limb.translate(0, top, 0);
      parts.push({ geo: limb, color: C.brown });
    }
  } else {
    const col = broadleafColor();
    const c1 = new THREE.IcosahedronGeometry(th * 0.26, 0);
    c1.scale(1, 1.25, 1);
    c1.translate(0, th * 0.72, 0);
    parts.push({ geo: c1, color: col });
    const c2 = new THREE.IcosahedronGeometry(th * 0.20, 0);
    c2.translate(0.1, th * 0.9, 0.05);
    parts.push({ geo: c2, color: col });
  }
  return mergeParts(parts);
}

// Queued placements — scatterPine/Oak/Hickory just record {x,z,th,variant}
// during the scatter loops below; finalizeInstancedTrees() (called once,
// after ALL scatter loops run) does the actual InstancedMesh construction,
// since InstancedMesh needs a fixed instance count up front and we don't know
// each variant's final population until scattering is done.
const pinePlacements = [], oakPlacements = [], hickoryPlacements = [];
function scatterPine(x, z) {
  const th = 0.85 + Math.random() * 1.0;
  pinePlacements.push({ x, z, th, variant: (Math.random() * TREE_VARIANTS) | 0 });
}
function scatterOak(x, z) {
  const th = 0.55 + Math.random() * 0.5;
  oakPlacements.push({ x, z, th, variant: (Math.random() * TREE_VARIANTS) | 0 });
}
function scatterHickory(x, z) {
  const th = 0.9 + Math.random() * 0.7;
  hickoryPlacements.push({ x, z, th, variant: (Math.random() * TREE_VARIANTS) | 0 });
}

const _instDummy = new THREE.Object3D();
// Builds the InstancedMeshes for one species: `variantFn` builds one prefab
// geometry, `placements` is the queued {x,z,th,variant} list, `flex` is the
// species' wind-sway stiffness (same constant the old per-species
// registerTree() calls used).
function buildInstancedSpecies(placements, variantFn, flex) {
  if (placements.length === 0) return;
  const buckets = Array.from({ length: TREE_VARIANTS }, () => []);
  for (const p of placements) buckets[p.variant].push(p);
  const variantGeoms = Array.from({ length: TREE_VARIANTS }, variantFn);
  for (let v = 0; v < TREE_VARIANTS; v++) {
    const bucket = buckets[v];
    if (bucket.length === 0) { variantGeoms[v].dispose(); continue; }
    const im = new THREE.InstancedMesh(variantGeoms[v], TREE_MAT, bucket.length);
    im.castShadow = true;
    im.receiveShadow = true;
    for (let i = 0; i < bucket.length; i++) {
      const p = bucket[i];
      const baseY = heightAt(p.x, p.z);
      _instDummy.position.set(p.x, baseY, p.z);
      _instDummy.rotation.set(0, 0, 0);
      _instDummy.scale.setScalar(p.th);
      _instDummy.updateMatrix();
      im.setMatrixAt(i, _instDummy.matrix);
      // Subtle per-instance brightness jitter so repeated prefabs don't read
      // as obviously cloned — multiplies the baked vertex colors.
      const j = 1 + (Math.random() - 0.5) * 0.16;
      im.setColorAt(i, new THREE.Color(j, j, j));
      registerTreeInstance(im, i, p.x, p.z, baseY, p.th, flex);
    }
    im.instanceMatrix.needsUpdate = true;
    if (im.instanceColor) im.instanceColor.needsUpdate = true;
    scene.add(im);
    TREE_INSTANCED_MESHES.push(im);
  }
}
function finalizeInstancedTrees() {
  buildInstancedSpecies(pinePlacements, pineVariantGeometry, 0.6);    // pines are stiffer/lower-profile — less sway
  buildInstancedSpecies(oakPlacements, oakVariantGeometry, 1.0);      // wide broadleaf canopy sways more than a pine
  buildInstancedSpecies(hickoryPlacements, hickoryVariantGeometry, 0.9);
}

function scatterBush(x, z) {
  const h = heightAt(x, z);
  const g = new THREE.Group();
  g.position.set(x, h, z);
  const clumps = 1 + Math.floor(Math.random() * 2);
  for (let k = 0; k < clumps; k++) {
    const s = 0.09 + Math.random() * 0.11;
    let col = Math.random() > 0.5 ? 0x3E6428 : 0x355A22;
    if (SEASON.snow) col = snowify(col, 0.55);
    else if (SEASON.name === 'Autumn') col = Math.random() > 0.5 ? 0x9A5A2A : 0x7A4A28;
    const b = mesh(new THREE.IcosahedronGeometry(s, 0), col, g);
    b.position.set((Math.random() - 0.5) * 0.22, s * 0.65, (Math.random() - 0.5) * 0.22);
    b.scale.y = 0.7;
  }
  g.traverse(c => { c.castShadow = false; }); // small prop — skip the shadow pass
  scene.add(g);
  // Small/light — sways more readily per unit wind than a tree does.
  BUSHES.push({ g, bx: x, bz: z, flex: 1.3, windSeed: makeWindSeed(x, z) });
}

function scatterReed(x, z) {
  const h = heightAt(x, z);
  const g = new THREE.Group();
  g.position.set(x, h, z);
  const th = 0.28 + Math.random() * 0.22;

  for (let k = 0; k < 3; k++) {
    const reed = mesh(new THREE.CylinderGeometry(0.012, 0.02, th, 4), col, g);
    reed.position.set((Math.random() - 0.5) * 0.12, th * 0.5, (Math.random() - 0.5) * 0.12);
    reed.rotation.z = (Math.random() - 0.5) * 0.25;

function scatterRock(x, z) {
  const h = heightAt(x, z);
  let color = Math.random() > 0.5 ? 0x6B7A5E : C.stone;
  if (SEASON.snow) color = snowify(color, 0.6);

  const r = mesh(new THREE.DodecahedronGeometry(s, 0), color, scene);
  r.position.set(x, h + s * (0.10 + Math.random() * 0.14), z);

// ── Project Objects ───────────────────────────────────────────────────────────
// Shared winter snow dusting for the 6 interactable objects — a thin flattened
// box, no-op outside SEASON.snow. castShadow off (thin decorative dusting, not
// worth the shadow-pass cost — same call made for bushes/reeds elsewhere).
function addSnow(parent, x, y, z, sx, sy, sz, rotY = 0) {
  if (!SEASON.snow) return;
  const s = mesh(new THREE.BoxGeometry(sx, sy, sz), 0xEEF3F4, parent);
  s.position.set(x, y, z);
  s.rotation.y = rotY;
  s.castShadow = false;
}
function makeTombstone(g) {
  // Classic rounded-arch grave marker — straight sides, flat base, a single
  // arc across the top — with three short inscription lines on the face.
  const w = 0.50, h = 0.68, depth = 0.13, r = w / 2;
  const s = new THREE.Shape();
  s.moveTo(-r, 0);
  s.lineTo(-r, h - r);
  s.absarc(0, h - r, r, Math.PI, 0, true);
  s.lineTo(r, 0);
  s.closePath();
  const slab = mesh(new THREE.ExtrudeGeometry(s, { depth, bevelEnabled: false }), C.stoneLight, g);
  slab.position.set(0, 0, -depth / 2);
  const lineGeo = new THREE.BoxGeometry(0.26, 0.035, 0.02);
  [0.40, 0.31, 0.22].forEach(y => {
    mesh(lineGeo, C.stone, g).position.set(0, y, depth / 2 + 0.01);
  });
  mesh(new THREE.CylinderGeometry(0.35, 0.42, 0.08, 6), C.soil, g).position.y = 0.04;
  addSnow(g, 0, h - 0.02, 0, w * 0.82, 0.035, depth * 0.9);      // cap across the arch top
  addSnow(g, 0, 0.085, 0, 0.60, 0.03, 0.60);                      // dusting on the soil mound
}
function makeCrown(g) {
  const s = new THREE.Shape();
  s.moveTo(-0.26, 0.00);
  s.lineTo( 0.26, 0.00);
  s.lineTo( 0.26, 0.14);
  s.lineTo( 0.17, 0.30);
  s.lineTo( 0.085, 0.16);
  s.lineTo( 0.00, 0.34);
  s.lineTo(-0.085, 0.16);
  s.lineTo(-0.17, 0.30);
  s.lineTo(-0.26, 0.14);
  s.closePath();
  const crown = mesh(new THREE.ExtrudeGeometry(s, { depth: 0.10, bevelEnabled: false }), C.gold, g);
  crown.position.z = -0.05; crown.position.y = 0.05;
  // Small dustings on the 3 points — same y-values as the shape's tips above.
  [[0, 0.34], [0.17, 0.30], [-0.17, 0.30]].forEach(([px, py]) => {
    addSnow(g, px, py + 0.06, 0.02, 0.09, 0.03, 0.05);
  });
}

// ── Physics-style water wake ─────────────────────────────────────────────────
// The deer's motion drops expanding wavefronts on the pond. Each frame the water
// vertices within a small radius of the deer are displaced by the summed,
// damped, outward-travelling sine rings — a lightweight wave model, not flat
// decorative rings. Work is culled to the deer's vicinity so cost stays low.
const WAKE = [];        // { x, z, age }
const WAKE_MAX = 8;
let wakeTimer = 0;
let waterWaked = false;  // was the surface displaced last frame? (for the reset pass)
function spawnWake(x, z) {
  WAKE.push({ x, z, age: 0 });

}

// ── Surface disturbance layering ──────────────────────────────────────────
// The shoreline, the deer's wake rings, and the deer's own contact outline
// are all the same thing — water meeting something — so they all drive the
// SAME two colour layers (a wider shore tint, with a narrower foam band
// inside it) from the SAME palette. Previously the wake blended toward a
// hardcoded near-white (0.97/0.99/0.97) while the shore used
// WATER_FOAM_COLOR (0xF4F8F6) — fixed, but a SECOND, subtler mismatch
// remained even after matching the target colour: the shoreline's foamT
// SATURATES to a flat 1.0 plateau across its whole EDGE_SOFT band (real
// foam is a solid line), but the wake ring's derivative-of-Gaussian crest
// only ever reaches a soft peak of ~0.24 pre-gain — at the old gain
// (1.15) that peaked around foamT≈0.28, nowhere near saturated, so it
// blended mostly with whatever colour was already there (usually dark
// open water near the deer) instead of reading as bright foam. Verified by
// direct computation: crest·fall peaks at 0.244 (age≈0, d≈0.87), so a gain
// of ~3.2-3.5 is needed to actually saturate it the way the shore does.
const RIPPLE_TINT_GAIN = 4.0;   // whole ring disturbance (crest AND trough)
const RIPPLE_FOAM_GAIN = 3.4;   // crest only → narrower bright line inside the tint
// The deer's persistent waterline: where its body meets the surface there is
// an outline whether or not it's moving — exactly like the shore always has
// one. Two widths give it the same layered structure (wide tint, narrow foam
// inside), and (see below) both now hit a hard 1.0 exactly at DEER_R —
// matching the shoreline's own flat plateau — rather than a pulse-dimmed
// peak that let the underlying (often much darker, deep-water) base colour
// show through and read as a mismatched tint. Declared here, not with the
// other water constants up top, because DEER_R is only defined with the
// collision system above this point.
const CONTACT_TINT_W = 0.55;
const CONTACT_FOAM_W = 0.26;
const CONTACT_MAX_R2 = (DEER_R + CONTACT_TINT_W + 0.1) ** 2;
// How submerged the deer must be before it has a waterline at all (0 on dry
// land → 1 once genuinely wet) — keyed off REAL depth (live water surface
// minus actual ground height, the same waterSurfaceHeightAt/heightAt pair
// the swim logic in animate() uses for its own `swimDepth`), not the
// abstract lakeInf field. This is deliberately a much SHALLOWER band than
// SWIM_DEPTH_MIN/MAX (floating) — a waterline should appear the moment water
// actually touches the legs, well before the deer is deep enough to float.
// CONTACT_DEPTH_MIN is shared with the wake-spawn condition in animate() so
// the two agree by construction: any depth that shows a waterline is also a
// depth at which walking disturbs the surface.
const CONTACT_DEPTH_MIN = 0.02, CONTACT_DEPTH_MAX = 0.16;
function deerContactAmount(deerX, deerZ, gustEnv) {
  if (SEASON.ice) return 0; // frozen solid — no waterline forms against ice
  const depth = waterSurfaceHeightAt(deerX, deerZ, gustEnv) - heightAt(deerX, deerZ);
  return smoothstep(CONTACT_DEPTH_MIN, CONTACT_DEPTH_MAX, depth);
}
// The water is a real (if stylized) body of water, not a decorated plane:
// every frame each vertex's surface height is recomputed as
//   surfaceY = WATER_LEVEL + swell + ambient chop + deer wake
// and then compared against that vertex's STATIC lakebed height
// (waterBedH). The difference is a genuine depth, and EVERYTHING visible
// derives from it:
//   depth <= 0        → the water has receded past this point: alpha 0.
//   depth ~ 0         → the live waterline: foam.
//   shallow → deep    → shore tint → open-water color.
// So the edge moves because the surface genuinely rises and falls over a
// sloped bed (a small vertical swell sweeps the edge a long way horizontally
// on a gentle slope — real lake behavior), the foam band tracks the edge for
// free because it's anchored to depth rather than a baked position, and a
// deer's wake ring perturbs the shoreline simply by being part of surfaceY.
// The lakebed and beach never move; only the water does.
function updateWaterWake(dt, deerX, deerZ, gustEnv) {
  if (!waterGeo || SEASON.ice) return;   // frozen pond: surface doesn't move
  const wm = SEASON.waterMotion;
  for (const s of WAKE) s.age += dt;
  while (WAKE.length && WAKE[0].age > 1.4) WAKE.shift();
  const active = WAKE.length > 0;

  const posA = waterGeo.attributes.position.array;
  const colA = waterGeo.attributes.color.array;
  const n = waterGeo.attributes.position.count;
  const tA = t * wm.speed, tB = t * wm.speed * 0.8;
  const halfAmp = wm.amp * 0.5, sh = wm.shimmer;
  // Once per frame, not per vertex: is the deer actually in the water (and so
  // does it have a waterline to draw)? Independent of whether it's MOVING —
  // that's the whole point of the contact outline.
  const contactAmt = deerContactAmount(deerX, deerZ, gustEnv);

  for (let i = 0; i < n; i++) {
    const ix = i * 3, ic = i * 4;   // position stride 3, color stride 4 (RGBA)
    const vx = posA[ix], vz = posA[ix + 2];
    const ddx = vx - deerX, ddz = vz - deerZ;
    const dDeer2 = ddx * ddx + ddz * ddz;

    // Everything that lifts the surface is masked to zero right around the
    // deer's body. The deer's own Y rides a smooth non-oscillating height
    // (visibleSurfaceHeightAt), so without this a crest could independently
    // rise into its neck. Same guarantee as before, now covering the swell
    // too, not just the ambient chop.
    const bodyMask = dDeer2 < AMBIENT_MASK_FULL_R2
      ? smoothstep(AMBIENT_MASK_CLEAR_R2, AMBIENT_MASK_FULL_R2, dDeer2)
      : 1;

    // 1. Wind swell — the slow, large-scale traveling rise/fall of the water
    //    LEVEL. This is what moves the waterline.
    const swell = swellAt(waterWindPhase[i], gustEnv);
    // 2. Ambient chop — small high-frequency surface texture on top.
    const hA = Math.sin(waterPhaseA[i] + tA);
    const hB = Math.sin(waterPhaseB[i] + tB);
    let disp = (swell + (hA + hB) * halfAmp) * bodyMask;
    // Disturbance layers, gathered from every source, then applied once below.
    let rippleTint = 0, rippleFoam = 0;

    // 3. Deer swim wake — part of the same surface height, so it perturbs the
    //    edge and foam exactly like the swell does, instead of being an
    //    overlay skating across the top.
    if (active && dDeer2 < 36) {   // only verts within ~6u of the deer
      for (const s of WAKE) {
        const d = Math.hypot(vx - s.x, vz - s.z);
        // Birth radius offset by DEER_R so a fresh ring starts already past the
        // deer's own body instead of peaking directly under it. Gentle outward
        // travel (2.0) so rings breathe out rather than snapping away.
        const ring = d - (DEER_R + s.age * 2.0);
        if (ring < -1.4 || ring > 0.6) continue;
        // A SINGLE soft crest per ring (derivative-of-Gaussian, one clean
        // trough→crest wave) with a long soft fade — reads as a calm rain
        // ripple, not the old busy multi-band sin(ring*5) stack.
        const fall = Math.exp(-s.age * 1.3) * Math.exp(-d * 0.12);
        const wave = ring * Math.exp(-ring * ring * 2.5);
        disp += wave * fall * 0.26;                  // amplitude ~0.07
        // Layer 1: the whole ring disturbance (crest AND trough) tints like
        // shallow water. Layer 2: only the crest carries foam, so the foam
        // sits as a narrower bright line INSIDE the tint band — the same
        // wide-tint/narrow-foam structure the shoreline has.
        const tA2 = Math.abs(wave) * fall * RIPPLE_TINT_GAIN;
        if (tA2 > rippleTint) rippleTint = tA2;
        const fA2 = Math.max(0, wave) * fall * RIPPLE_FOAM_GAIN;
        if (fA2 > rippleFoam) rippleFoam = fA2;
      }
    }

    // 4. The deer's own waterline — a persistent outline where its body meets
    //    the surface, present whether or not it's moving (a standing object in
    //    water still has a waterline; only wake rings need motion). Same two
    //    layers, so it matches both the shore and the ripples.
    if (contactAmt > 0 && dDeer2 < CONTACT_MAX_R2) {
      const dD = Math.sqrt(dDeer2);
      const off = Math.abs(dD - DEER_R);   // distance from the body's waterline
      // "Life" comes from the ring's WIDTH breathing, not its peak brightness
      // dimming — a brightness pulse (the previous version) meant the outline
      // never actually reached the shoreline's own saturated foam colour
      // except at the instant the pulse peaked, so it read as a dimmer,
      // differently-tinted ring most of the time. Widening/narrowing instead
      // keeps `off=0` (right at DEER_R) pinned to exactly 1 always, matching
      // the shore's flat plateau, while still visibly moving.
      const wobble = 1 + 0.15 * Math.sin(t * 2.2 - dD * 3.0);
      const cT = contactAmt * (1 - smoothstep(0, CONTACT_TINT_W * wobble, off));
      if (cT > rippleTint) rippleTint = cT;
      const cF = contactAmt * (1 - smoothstep(0, CONTACT_FOAM_W * wobble, off));
      if (cF > rippleFoam) rippleFoam = cF;
    }
    posA[ix + 1] = disp;

    // Live depth of water over the static bed at this point.
    const depth = (WATER_LEVEL + disp) - waterBedH[i];

    // Alpha: the water simply isn't there where it has receded past the bed.
    // This is the moving waterline — no painted border involved.
    const wet = smoothstep(0, EDGE_SOFT, depth);

    // ── One layered colour pipeline for every "water meets something" ──
    // Shoreline, wake rings and the deer's waterline all feed the same two
    // bands from the same palette, so they read as one material.
    const tintT = Math.min(1, Math.max(smoothstep(SHORE_TINT_DEPTH, 0, depth), rippleTint));
    const foamT = Math.min(1, Math.max(smoothstep(FOAM_DEPTH, EDGE_SOFT, depth), rippleFoam)) * 0.92;

    let r = waterBaseColor[ic], g = waterBaseColor[ic + 1], b = waterBaseColor[ic + 2];
    if (tintT > 0) { r += (WATER_SHORE_COLOR.r - r) * tintT; g += (WATER_SHORE_COLOR.g - g) * tintT; b += (WATER_SHORE_COLOR.b - b) * tintT; }

    // darkened by the chop riding under it.
    const shimmer = 1 + (hA * 0.6 + hB * 0.4) * sh;
    r *= shimmer; g *= shimmer; b *= shimmer;
    if (foamT > 0) { r += (WATER_FOAM_COLOR.r - r) * foamT; g += (WATER_FOAM_COLOR.g - g) * foamT; b += (WATER_FOAM_COLOR.b - b) * foamT; }
    if (r > 1) r = 1; if (g > 1) g = 1; if (b > 1) b = 1;
    colA[ic]     = r;
    colA[ic + 1] = g;
    colA[ic + 2] = b;
    colA[ic + 3] = wet;
  }
  waterGeo.attributes.position.needsUpdate = true;
  waterGeo.attributes.color.needsUpdate = true;
  // Normals EVERY frame — not just during wakes. This is what was missing:
  // displacing vertices without recomputing normals changes no lighting at
  // all, so the surface rendered as a flat sheet no matter how much it
  // actually moved. Affordable now because the mesh is indexed (~6x fewer
  // vertices than the old non-indexed expansion), and indexing is also what
  // makes these normals smooth rather than faceted.
  waterGeo.computeVertexNormals();
  waterWaked = active;
}

// (deer never sits jammed against a screen edge). Forest extends past this to
// WORLD and fog hides the true edge.
const EDGE_MARGIN = 6;
const WALK = BOUND + EDGE_MARGIN;

// derived from the camera height/tilt/FOV/aspect. Used to clamp the follow
// point so the frame stops exactly at the walkable edge (and holds at corners).

  const Hc = CAM_OFFSET.y, Dc = CAM_OFFSET.z;
  const pitch = Math.atan2(Hc - 0.6, Dc);
  const fv = THREE.MathUtils.degToRad(camera.fov) / 2;
  const gr = a => Hc / Math.tan(Math.max(0.06, a));
  reachN = Math.max(2, gr(pitch - fv) - Dc);   // away from camera (top of frame)
  reachS = Math.max(2, Dc - gr(pitch + fv));   // toward camera (bottom of frame)

        if (at < DANCE_FACE_DURATION) {
          // Turn to face the camera/player first — same easing shape as the
          // walking-turn/mouse-look code elsewhere in this file.
          const dx = camera.position.x - pos.x, dz = camera.position.z - pos.z;
          const ta = Math.atan2(-dx, -dz);
          headingAngle += wrapAngle(ta - headingAngle) * frameEase(0.18);
        } else {
          // A goofy shimmy: big side-to-side bank (same quaternion path as
          // the walking gait's bank, so it stays slope-aligned) + a bouncy
          // hop + a head bob, all off one shared clock so it reads as one
          // motion. `dt` restarts at 0 once the facing turn above is done.
          const dt = at - DANCE_FACE_DURATION;
          bankAngle = Math.sin(dt * 9.5) * 0.34;
          headGroup.rotation.x = Math.sin(dt * 9.5 + 0.4) * 0.16;
          headGroup.rotation.y = Math.sin(dt * 5.0) * 0.22;
          deerRoot.position.y += Math.abs(Math.sin(dt * 9.0)) * 0.14;
          legGroups.forEach(hip => { hip.rotation.x = Math.sin(dt * 9.5 + hip.userData.phase) * 0.35; });
        }
      } else if (idleAction === 'speak') {
        // A small nod while "talking."
        headGroup.rotation.x = Math.sin(at * 3.0) * 0.10;
        headGroup.rotation.y = Math.sin(at * 1.6) * 0.08;
      }
    }

    // Tilt to stand perpendicular to the ground — but treat the whole near-water
    // band as flat (lakeInf > 0.30), since the deer is riding the flat waterline
    // there, not the steep sunken shore. This is the same threshold the water
    // mesh uses for its shoreline, so tilt and position agree.
    updateDeerOrientation(pos.x, pos.z, headingAngle, bankAngle, lakeInf > 0.30, lakeInf);

    // Wake rings whenever it's MOVING through unfrozen water — shallow wading
    // included, gated on the same real-depth check (CONTACT_DEPTH_MIN) the
    // contact outline uses, via the `swimDepth` already computed above. Any
    // depth that shows a waterline is also a depth at which walking disturbs
    // the surface — not full swim depth only, which left a wading deer
    // showing a waterline while disturbing nothing.
    if (walking && !SEASON.ice && swimDepth > CONTACT_DEPTH_MIN) {
      wakeTimer += 0.044 * dtScale;
      if (wakeTimer > 0.20) { wakeTimer = 0; spawnWake(pos.x, pos.z); } // sparser trail — less crowded, calmer
    }
  }

  // _gustEnv computed at the top of this function now — shared by the deer's
  // own water logic above as well as trees/bushes/water below.
  updateTreeWind(_gustEnv);
  updateBushWind(_gustEnv);

  // Real elapsed seconds (not dtScale) — updateWaterWake ages wake ripples in
  // actual seconds (`s.age += dt`, compared against a 1.4s lifetime).
  updateWaterWake(dt, deerRoot.position.x, deerRoot.position.z, _gustEnv);

  if (crownObj) {
    crownObj.grp.position.y = WATER_LEVEL + 0.30 + Math.sin(t * 1.4) * 0.04; // ride on top
    crownObj.grp.rotation.y += 0.004 * dtScale;
  }

  // Side-to-side wag, pivoting at the body attachment — faster/bigger mid-dance
  // (but not yet during the facing turn that leads into it).
  const dancing = idleAction === 'dance' && (t - idleActionStart) >= DANCE_FACE_DURATION;
  tailGrp.rotation.y = dancing
    ? Math.sin(t * 9.0) * 0.55
    : Math.sin(t * 5.0) * 0.30;

  nearbyObj = null;
  if (!interacting && !sandboxMode) {
    let minDist = Infinity;
    projectObjects.forEach(obj => {
      const d = deerRoot.position.distanceTo(obj.grp.position);
      if (d < INTERACT_RADIUS && d < minDist) { minDist = d; nearbyObj = obj; }
    });
    if (nearbyObj) showEPrompt(nearbyObj); else hideEPrompt();
  }

  if (idleAction === 'speak') {
    headGroup.getWorldPosition(_speechPos);
    _speechPos.y += 0.55;
    const sp = toScreen(_speechPos);
    deerSpeechEl.style.left = sp.x + 'px'; deerSpeechEl.style.top = sp.y + 'px';
  }

  // Opening descent: ONE motion at a time. While it's running, camLookTarget
  // is not touched (still exactly where clampFollow set it at load) and the
  // deer is frozen (see deerFrozen's declaration), so the only thing moving
  // is the camera itself, along a single smoothstep from SKY_START_OFFSET to
  // CAM_OFFSET — no competing lerp/zoom/follow systems fighting each other,
  // which is what the old version's wobble actually was.
  const introK = PREFERS_REDUCED_MOTION ? 1 : Math.min(1, (performance.now() - _introStart) / INTRO_MS);
  if (introK < 1) {
    const es = introK * introK * (3 - 2 * introK);   // smoothstep
    camera.position.set(
      camLookTarget.x + THREE.MathUtils.lerp(SKY_START_OFFSET.x, CAM_OFFSET.x, es),
      camLookTarget.y + THREE.MathUtils.lerp(SKY_START_OFFSET.y, CAM_OFFSET.y, es),
      camLookTarget.z + THREE.MathUtils.lerp(SKY_START_OFFSET.z, CAM_OFFSET.z, es));
    camera.lookAt(camLookTarget.x, camLookTarget.y + 0.6, camLookTarget.z);
  } else {
    if (deerFrozen) deerFrozen = false;   // descent just completed this frame — release the deer
    // Edge-clamped follow: the camera tracks a clamped version of the deer's
    // position so the frame never passes the walkable edge; when the deer
    // reaches an edge/corner the camera holds there and the deer moves
    // within the frame, resuming follow when it heads back inward.
    _camFollow.set(deerRoot.position.x, deerRoot.position.y, deerRoot.position.z);
    clampFollow(_camFollow);
    camLookTarget.lerp(_camFollow, frameEase(0.08));
    const desiredCamPos = new THREE.Vector3(
      camLookTarget.x + CAM_OFFSET.x,
      camLookTarget.y + CAM_OFFSET.y,
      camLookTarget.z + CAM_OFFSET.z);
    camera.position.lerp(desiredCamPos, frameEase(0.06));
    camera.lookAt(camLookTarget.x, camLookTarget.y + 0.6, camLookTarget.z);
  }

  renderer.render(scene, camera);
}
animate();
window.__DEBUG_HOOK__ = { deerRoot, wanderTarget, camLookTarget };

window.addEventListener('resize', () => {
  W = window.innerWidth; H = window.innerHeight;
  camera.aspect = W / H; camera.updateProjectionMatrix();
  renderer.setSize(W, H);
  computeCamReach();   // view extents depend on aspect
});

// ── EMBED BRIDGE (portfolio hero integration) ──
// Active ONLY under ?embed=1, i.e. when this file is loaded inside the
// portfolio's hero iframe. The standalone dogdeer-world.html is untouched.
// Talks to the parent portfolio via postMessage: announces the season, forwards
// the pointer (the iframe otherwise swallows the parent's mousemove so its
// cursor can't track over the world), pulses "guide" on interaction, and
// accepts pause/resume so the world's render loop yields to the parent's
// GSAP/ScrollTrigger index while the hero is scrolled off-screen.
if (new URLSearchParams(location.search).has('embed')) {
  const _post = (msg) => { try { parent.postMessage(msg, '*'); } catch (e) {} };
  document.documentElement.style.cursor = 'none';   // the parent renders the unified cursor over the iframe
  const _ef = document.getElementById('edge-fog'); if (_ef) _ef.style.display = 'none';   // vignette off in the portfolio hero (Morris, 2026-07-17)
  const _announceSeason = () => _post({ type: 'ddw:season', name: SEASON.name });
  _announceSeason();
  window.addEventListener('message', (e) => {
    const d = e.data;
    if (!d || typeof d.type !== 'string') return;
    if (d.type === 'ddw:hello') _announceSeason();                          // parent attached its listener late — resend
    else if (d.type === 'ddw:pause') _ddwPaused = true;
    else if (d.type === 'ddw:resume') { _ddwPaused = false; _maybeResume(); }
  });
  // Forward pointer position, throttled to one post per frame.
  let _ptr = null;
  window.addEventListener('mousemove', (e) => { _ptr = { x: e.clientX, y: e.clientY }; });
  window.addEventListener('mouseleave', () => _post({ type: 'ddw:pointerleave' }));
  (function _pump() {
    requestAnimationFrame(_pump);
    if (_ptr) { _post({ type: 'ddw:pointer', x: _ptr.x, y: _ptr.y }); _ptr = null; }
  })();
  // Any press on the world = "guiding" — the parent fades its title + nav out
  // and restores them after a few idle seconds.
  renderer.domElement.addEventListener('pointerdown', () => _post({ type: 'ddw:guide' }));
}

</script>
</body>
